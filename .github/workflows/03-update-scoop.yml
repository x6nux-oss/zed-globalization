name: 03 更新 Scoop Manifest

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release 版本号（both 模式时忽略）"
        required: false
        type: string
      is_prerelease:
        description: "是否为 Pre-release"
        required: false
        default: "false"
        type: string
      mode:
        description: "更新模式"
        required: false
        default: "auto"
        type: choice
        options:
          - auto       # 根据 version_tag 自动判断稳定/预览
          - stable     # 仅更新稳定版
          - prerelease # 仅更新预览版
          - both       # 同时拉取最新稳定版和预览版并推送
      compat:
        description: "是否生成 zedg-compat manifest（额外 shim `zed` 命令，覆盖官方 zed 的 PATH 位置）"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  update-bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: 生成并推送 Manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_IS_PRE: ${{ inputs.is_prerelease }}
          INPUT_COMPAT: ${{ inputs.compat }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_IS_PRE: ${{ github.event.release.prerelease }}
          SCOOP_PAT: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -e
          source scripts/lib/github.sh
          BUCKET_REPO="https://x-access-token:${SCOOP_PAT}@github.com/x6nux-oss/scoop-zedg.git"

          # ── 等待并获取 Windows 产物 URL ────────────────────────────
          # 走 gh_api（认证 + 指数退避重试 + 限流识别），并在 jq 取值前校验
          # .assets 是数组，避免 API 返回错误 JSON 时出现 Cannot iterate over null
          fetch_assets() {
            # 外层已有 20 次轮询，这里的单次请求不必再重试 5 轮（避免放大请求量）
            local GH_API_MAX_ATTEMPTS=2
            local tag="$1" i json
            # 显式初始化：未匹配到产物时保持确定的空值
            ASSET_X64=""
            ASSET_ARM64=""
            for i in $(seq 1 20); do
              if json=$(gh_api "repos/${GH_REPO}/releases/tags/${tag}") \
                 && require_json "$json" '.assets | type == "array"' "${tag} 的 release 响应"; then
                ASSET_X64=$(printf '%s' "$json" | jq -r '[ (.assets // [])[] | select(.name|test("windows-x86_64.*\\.zip")) | .browser_download_url ][0] // empty')
                ASSET_ARM64=$(printf '%s' "$json" | jq -r '[ (.assets // [])[] | select(.name|test("windows-aarch64.*\\.zip")) | .browser_download_url ][0] // empty')
                if [ -n "$ASSET_X64" ]; then return 0; fi
              fi
              echo "[$i/20] $tag 产物未就绪，等待 15s..."; sleep 15
            done
            echo "::error::未找到 $tag 的 Windows x64 产物（已轮询 20 次）"; return 1
          }

          # ── 计算远程文件 SHA256 ────────────────────────────────────
          # --fail：4xx/5xx 时不要拿错误页去算 hash；--retry 处理瞬时断连
          remote_sha256() {
            local tmp; tmp=$(mktemp)
            if ! curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$tmp" "$1"; then
              echo "::error::下载失败: $1" >&2; rm -f "$tmp"; return 1
            fi
            if [ ! -s "$tmp" ]; then
              echo "::error::下载内容为空: $1" >&2; rm -f "$tmp"; return 1
            fi
            sha256sum "$tmp" | awk '{print $1}'
            rm -f "$tmp"
          }

          # ── 生成单个 manifest ──────────────────────────────────────
          make_manifest() {
            local tag="$1" is_pre="$2" out="$3" compat="${4:-false}"
            local clean="${tag#v}"
            local repo_url="https://github.com/${GH_REPO}"
            local desc="Zed Editor (Localized / 汉化版)"
            [ "$is_pre" = "true" ] && desc="$desc - Preview"

            fetch_assets "$tag"
            local hash_x64; hash_x64=$(remote_sha256 "$ASSET_X64")

            # autoupdate 模板中 $version 是 Scoop 占位符，需对 shell 转义
            local au_x64_url="${repo_url}/releases/download/v\$version/zedg-zh-cn-windows-x86_64-v\$version.zip"
            local au_x64_hash="${repo_url}/releases/download/v\$version/sha256sums.txt"
            local au_x64_regex='([a-f0-9]{64})\s+zedg-zh-cn-windows-x86_64-v\$version\.zip'

            local manifest
            manifest=$(jq -n \
              --argjson compat "$compat" \
              --arg version  "$clean" \
              --arg desc     "$desc" \
              --arg homepage "$repo_url" \
              --arg url_x64  "$ASSET_X64" \
              --arg hash_x64 "$hash_x64" \
              --arg au_url   "$au_x64_url" \
              --arg au_hash  "$au_x64_hash" \
              --arg au_regex "$au_x64_regex" \
              '{
                version: $version, description: $desc,
                homepage: $homepage, license: "GPL-3.0-only",
                architecture: {"64bit": {url: $url_x64, hash: $hash_x64}},
                bin: ([["bin\\ZedG.exe", "zedg"]] +
                      (if $compat == "true" then [["bin\\ZedG.exe", "zed"]] else [] end)),
                shortcuts: [["ZedG.exe", "ZedG"]],
                post_install: [
                  "$desktop = [Environment]::GetFolderPath(\"Desktop\")",
                  "$ws = New-Object -ComObject WScript.Shell",
                  "$lnk = $ws.CreateShortcut(\"$desktop\\ZedG.lnk\")",
                  "$lnk.TargetPath = \"$dir\\ZedG.exe\"",
                  "$lnk.WorkingDirectory = \"$dir\"",
                  "$lnk.Save()"
                ],
                pre_uninstall: [
                  "$desktop = [Environment]::GetFolderPath(\"Desktop\")",
                  "Remove-Item \"$desktop\\ZedG.lnk\" -ErrorAction SilentlyContinue"
                ],
                checkver: {github: $homepage},
                autoupdate: {architecture: {"64bit": {
                  url: $au_url, hash: {url: $au_hash, regex: $au_regex}
                }}}
              }')

            # 若有 ARM64 产物则追加
            if [ -n "$ASSET_ARM64" ] && [ "$ASSET_ARM64" != "null" ]; then
              local hash_arm64; hash_arm64=$(remote_sha256 "$ASSET_ARM64")
              local au_arm64_url="${repo_url}/releases/download/v\$version/zedg-zh-cn-windows-aarch64-v\$version.zip"
              local au_arm64_hash="${repo_url}/releases/download/v\$version/sha256sums.txt"
              local au_arm64_regex='([a-f0-9]{64})\s+zedg-zh-cn-windows-aarch64-v\$version\.zip'
              manifest=$(echo "$manifest" | jq \
                --arg url   "$ASSET_ARM64" \
                --arg hash  "$hash_arm64" \
                --arg au_url   "$au_arm64_url" \
                --arg au_hash  "$au_arm64_hash" \
                --arg au_regex "$au_arm64_regex" \
                '.architecture.arm64 = {url: $url, hash: $hash} |
                 .autoupdate.architecture.arm64 = {url: $au_url, hash: {url: $au_hash, regex: $au_regex}}')
            fi

            echo "$manifest" > "$out"
            echo "已生成 $(basename "$out")：$tag (prerelease=$is_pre)"
          }

          # ── 判断模式与目标版本 ─────────────────────────────────────
          MODE="${INPUT_MODE:-auto}"
          # compat=true 时额外生成 zedg-compat(.preview).json：除 zedg 命令外
          # 同时 shim `zed`，让生态工具/git difftool 把 ZedG 当默认编辑器。
          COMPAT="${INPUT_COMPAT:-false}"
          TARGET_TAG=""
          IS_PRE="false"

          if [ "$EVENT" = "release" ]; then
            TARGET_TAG="$EVENT_TAG"
            IS_PRE="$EVENT_IS_PRE"
            MODE="auto"
          fi

          mkdir -p /tmp/manifests

          # ── 取最新稳定版 tag（结构校验后再取值）─────────────────────
          latest_stable_tag() {
            local json
            json=$(gh_api "repos/${GH_REPO}/releases/latest") || {
              echo "::error::获取 ${GH_REPO} 最新 release 失败" >&2; return 1; }
            require_json "$json" '.tag_name | type == "string" and length > 0' \
              "releases/latest 响应" || return 1
            printf '%s' "$json" | jq -r '.tag_name'
          }

          if [ "$MODE" = "both" ]; then
            STABLE_TAG=$(latest_stable_tag) || exit 1
            LIST_JSON=$(gh_api "repos/${GH_REPO}/releases?per_page=20") || {
              echo "::error::获取 ${GH_REPO} release 列表失败"; exit 1; }
            require_json "$LIST_JSON" 'type == "array"' "releases 列表响应" || exit 1
            PRE_TAG=$(printf '%s' "$LIST_JSON" | jq -r '[.[]|select(.prerelease)][0].tag_name // empty')
            echo "both 模式：stable=$STABLE_TAG  prerelease=${PRE_TAG:-（无）}"
            make_manifest "$STABLE_TAG" "false" /tmp/manifests/zedg.json
            [ -n "$PRE_TAG" ] && make_manifest "$PRE_TAG" "true" /tmp/manifests/zedg-preview.json
            if [ "$COMPAT" = "true" ]; then
              make_manifest "$STABLE_TAG" "false" /tmp/manifests/zedg-compat.json "true"
              [ -n "$PRE_TAG" ] && make_manifest "$PRE_TAG" "true" /tmp/manifests/zedg-compat-preview.json "true"
            fi
          else
            if [ -z "$TARGET_TAG" ] && [ -n "$INPUT_TAG" ]; then
              TARGET_TAG="$INPUT_TAG"
              if [ -n "$INPUT_IS_PRE" ] && [ "$INPUT_IS_PRE" != "false" ]; then
                IS_PRE="$INPUT_IS_PRE"
              else
                REL_JSON=$(gh_api "repos/${GH_REPO}/releases/tags/${TARGET_TAG}") || {
                  echo "::error::获取 ${TARGET_TAG} 的 release 信息失败"; exit 1; }
                require_json "$REL_JSON" 'type == "object" and has("prerelease")' \
                  "${TARGET_TAG} 的 release 响应" || exit 1
                IS_PRE=$(printf '%s' "$REL_JSON" | jq -r '.prerelease // false')
              fi
            elif [ -z "$TARGET_TAG" ]; then
              TARGET_TAG=$(latest_stable_tag) || exit 1
              IS_PRE="false"
            fi
            [ "$MODE" = "stable" ]     && IS_PRE="false"
            [ "$MODE" = "prerelease" ] && IS_PRE="true"

            if [ "$IS_PRE" = "true" ]; then
              make_manifest "$TARGET_TAG" "true"  /tmp/manifests/zedg-preview.json
            else
              make_manifest "$TARGET_TAG" "false" /tmp/manifests/zedg.json
            fi
            if [ "$COMPAT" = "true" ]; then
              if [ "$IS_PRE" = "true" ]; then
                make_manifest "$TARGET_TAG" "true"  /tmp/manifests/zedg-compat-preview.json "true"
              else
                make_manifest "$TARGET_TAG" "false" /tmp/manifests/zedg-compat.json "true"
              fi
            fi
          fi

          # ── 推送到 x6nux-oss/scoop-zedg ───────────────────────────────
          git clone --depth 1 "$BUCKET_REPO" /tmp/scoop-zedg
          cd /tmp/scoop-zedg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp /tmp/manifests/*.json .
          git add *.json

          if git diff --cached --quiet; then
            echo "Manifest 无变化，跳过推送"
          else
            FILES=$(cd /tmp/manifests && ls ./*.json | xargs -I{} basename {} .json | tr '\n' ' ')
            git commit -m "chore: 更新 ${FILES% }"
            git push
          fi
