name: 04 更新 Homebrew Cask

on:
  workflow_run:
    workflows: ["02 构建发行"]
    types: [completed]

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release 版本号 (空则取最新)"
        required: false
        type: string
      is_prerelease:
        description: "是否为 Pre-release"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

env:
  TAP_REPO: x6nux-oss/homebrew-zedg

jobs:
  update-cask:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: 确定目标版本号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/lib/github.sh
          if [ -n "${{ inputs.version_tag }}" ]; then
            echo "手动指定版本: ${{ inputs.version_tag }}"
            echo "TARGET_TAG=${{ inputs.version_tag }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "Release 事件: ${{ github.event.release.tag_name }}"
            echo "TARGET_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            LATEST_JSON=$(gh_api "repos/${{ github.repository }}/releases/latest") || {
              echo "::error::获取最新 release 失败，无法确定目标版本"; exit 1; }
            require_json "$LATEST_JSON" '.tag_name | type == "string" and length > 0' \
              "releases/latest 响应" || exit 1
            TAG=$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name')
            echo "自动获取最新: $TAG"
            echo "TARGET_TAG=$TAG" >> $GITHUB_ENV
          fi

      - name: 判断是否为 Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/lib/github.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_PRE="${{ inputs.is_prerelease }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            IS_PRE="${{ github.event.release.prerelease }}"
          else
            REL_JSON=$(gh_api "repos/${{ github.repository }}/releases/tags/${TARGET_TAG}") || {
              echo "::error::获取 ${TARGET_TAG} 的 release 信息失败"; exit 1; }
            require_json "$REL_JSON" 'type == "object" and has("prerelease")' \
              "${TARGET_TAG} 的 release 响应" || exit 1
            IS_PRE=$(printf '%s' "$REL_JSON" | jq -r '.prerelease // false')
          fi
          echo "IS_PRERELEASE=$IS_PRE" >> $GITHUB_ENV
          echo "Pre-release: $IS_PRE"

      - name: 等待并获取 macOS 产物信息
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/lib/github.sh
          # 外层已有 20 次轮询，单次请求只重试 2 轮，避免放大请求量
          GH_API_MAX_ATTEMPTS=2
          TAG="$TARGET_TAG"
          URL_ARM=""
          URL_X86=""
          LAST_API_OK="false"
          for i in $(seq 1 20); do
            RELEASE_JSON=""
            if RELEASE_JSON=$(gh_api "repos/${{ github.repository }}/releases/tags/${TAG}") \
               && require_json "$RELEASE_JSON" '.assets | type == "array"' "${TAG} 的 release 响应"; then
              LAST_API_OK="true"
              URL_ARM=$(printf '%s' "$RELEASE_JSON" | jq -r '[ (.assets // [])[] | select(.name | test("macos-aarch64.*\\.dmg")) | .browser_download_url ][0] // empty')
              URL_X86=$(printf '%s' "$RELEASE_JSON" | jq -r '[ (.assets // [])[] | select(.name | test("macos-x86_64.*\\.dmg")) | .browser_download_url ][0] // empty')
              if [ -n "$URL_ARM" ] && [ -n "$URL_X86" ]; then
                echo "aarch64: $URL_ARM"
                echo "x86_64:  $URL_X86"
                echo "ASSET_URL_ARM=$URL_ARM" >> $GITHUB_ENV
                echo "ASSET_URL_X86=$URL_X86" >> $GITHUB_ENV
                break
              fi
            else
              LAST_API_OK="false"
            fi
            echo "[$i/20] 产物未就绪，等待 15s..."
            sleep 15
          done
          if [ -z "$URL_ARM" ] || [ -z "$URL_X86" ]; then
            # 区分「API 一直失败」与「API 正常但产物缺失」，避免误诊
            if [ "$LAST_API_OK" != "true" ]; then
              echo "::error::无法获取 ${TAG} 的 release 信息（GitHub API 持续失败），因此未能确认 macOS 分架构 DMG 产物"
            else
              echo "::error::${TAG} 的 release 可访问，但缺少 macOS aarch64 / x86_64 DMG 产物（已轮询 20 次）"
            fi
            exit 1
          fi

      - name: 下载并计算 Hash
        run: |
          # --fail：产物 URL 返回 4xx/5xx 时不要拿错误页算 hash
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o zedg-aarch64.dmg "$ASSET_URL_ARM"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o zedg-x86_64.dmg  "$ASSET_URL_X86"
          for f in zedg-aarch64.dmg zedg-x86_64.dmg; do
            if [ ! -s "$f" ]; then
              echo "::error::下载内容为空: $f"
              exit 1
            fi
          done
          SHA256_ARM=$(sha256sum zedg-aarch64.dmg | awk '{print $1}')
          SHA256_X86=$(sha256sum zedg-x86_64.dmg  | awk '{print $1}')
          echo "SHA256_ARM=$SHA256_ARM" >> $GITHUB_ENV
          echo "SHA256_X86=$SHA256_X86" >> $GITHUB_ENV
          echo "aarch64 SHA256: $SHA256_ARM"
          echo "x86_64  SHA256: $SHA256_X86"
          rm zedg-aarch64.dmg zedg-x86_64.dmg

      - name: 生成 Homebrew Cask
        run: |
          CLEAN_VERSION="${TARGET_TAG#v}"
          REPO="${{ github.repository }}"

          generate_cask() {
            local cask_name="$1"
            local out_file="$2"
            local desc_suffix="${3:+ - Preview}"
            mkdir -p Casks
            cat > "Casks/$out_file" <<CASK
          cask "$cask_name" do
            version "$CLEAN_VERSION"

            on_arm do
              url "$ASSET_URL_ARM"
              sha256 "$SHA256_ARM"
            end
            on_intel do
              url "$ASSET_URL_X86"
              sha256 "$SHA256_X86"
            end

            name "ZedG"
            desc "Zed Editor (Localized / 汉化版)$desc_suffix"
            homepage "https://github.com/$REPO"

            depends_on macos: ">= :ventura"

            app "ZedG.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/ZedG.app"]
            end

            zap trash: [
              "~/Library/Application Support/Zed",
              "~/Library/Caches/dev.zed.ZedG",
              "~/Library/Preferences/dev.zed.ZedG.plist",
            ]
          end
          CASK
          }

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "生成预览版 Cask"
            generate_cask "zedg-preview" "zedg-preview.rb" "preview"
          else
            echo "生成稳定版 Cask"
            generate_cask "zedg" "zedg.rb"
          fi

      - name: 推送到 tap 仓库
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="$TARGET_TAG"
          CLEAN_VERSION="${VERSION#v}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" /tmp/tap
          cd /tmp/tap

          mkdir -p Casks
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$IS_PRERELEASE" = "true" ]; then
            # Pre-release: 仅更新预览版
            cp $GITHUB_WORKSPACE/Casks/zedg-preview.rb Casks/
            git add Casks/zedg-preview.rb
            git diff --cached --quiet || git commit -m "chore: 预览版更新到 $VERSION"
          else
            # Stable release: 更新稳定版
            cp $GITHUB_WORKSPACE/Casks/zedg.rb Casks/
            git add Casks/zedg.rb

            # 如果稳定版比预览版更新，同步更新预览版
            PREVIEW_VER=""
            if [ -f Casks/zedg-preview.rb ]; then
              PREVIEW_VER=$(grep -oP 'version "\K[^"]+' Casks/zedg-preview.rb || true)
            fi

            if [ -z "$PREVIEW_VER" ] || \
               [ "$(printf '%s\n' "$CLEAN_VERSION" "$PREVIEW_VER" | sort -V | tail -1)" = "$CLEAN_VERSION" ] && \
               [ "$CLEAN_VERSION" != "$PREVIEW_VER" ]; then
              echo "稳定版 ($CLEAN_VERSION) 比预览版 ($PREVIEW_VER) 更新，同步更新预览版"
              REPO="${{ github.repository }}"
              cat > Casks/zedg-preview.rb <<CASK
          cask "zedg-preview" do
            version "$CLEAN_VERSION"

            on_arm do
              url "$ASSET_URL_ARM"
              sha256 "$SHA256_ARM"
            end
            on_intel do
              url "$ASSET_URL_X86"
              sha256 "$SHA256_X86"
            end

            name "ZedG"
            desc "Zed Editor (Localized / 汉化版) - Preview"
            homepage "https://github.com/$REPO"

            depends_on macos: ">= :ventura"

            app "ZedG.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/ZedG.app"]
            end

            zap trash: [
              "~/Library/Application Support/Zed",
              "~/Library/Caches/dev.zed.ZedG",
              "~/Library/Preferences/dev.zed.ZedG.plist",
            ]
          end
          CASK
              git add Casks/zedg-preview.rb
            fi

            git diff --cached --quiet || git commit -m "chore: 更新到 $VERSION"
          fi

          git push origin main
